condition: encodec_ids
inherits: base.yaml

encodec:
  bandwidth_kbps: 3.0   # -> 4 codebooks; we use first 3 as SemID levels

semantic_ids:
  source: encodec_direct
  n_levels: 3
  codebook_size: 1024
  aggregation: majority_vote

notes: >
  Use EnCodec 24kHz RVQ codebook indices directly as Semantic IDs.
  No RQ-VAE retraining; aggregate frame-level codes to one token per level
  via majority vote. Tests the RVQ <-> RQ-VAE architectural equivalence.
  Bandwidth 3.0 kbps -> 4 codebooks (we use first 3); 1.5 kbps would only
  give 2 codebooks, not enough for a 3-level SemID.
